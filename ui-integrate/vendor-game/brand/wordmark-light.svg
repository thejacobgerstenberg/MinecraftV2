<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" role="img" aria-label="LOOMFALL">
  <!-- LOOMFALL wordmark, light-background variant (glyphs recolored Duskwarp Violet; the gold thread keeps its Void Ink keyline for contrast on light grounds).
       One continuous Everthread: loop-knot anchor (west) -> woven through the warp glyphs
       (over the first O's eye, under the second) -> falling and fraying off the final L.
       Void Ink keyline under the gold keeps a >=0.15 luminance edge on any background. -->
  <!-- Everthread keyline (Void Ink) -->
  <g stroke="#14101F" fill="none" stroke-linecap="round">
    <circle cx="14" cy="80" r="6" stroke-width="8.75"/>
    <path stroke-width="8.75" d="M17.5 84.3 C22 87 26 88 33 88 H638 C649 88 652.5 97 652 110 C650.5 130 644 146 645.5 168"/>
    <path stroke-width="6.8" d="M645.5 168 C643 184 633 198 621 208"/>
    <path stroke-width="6.8" d="M645.5 168 C646.5 188 645.5 202 641 217"/>
    <path stroke-width="6.8" d="M645.5 168 C650 183 659.5 193.5 669 200"/>
  </g>
  <!-- Everthread (gold) -->
  <g stroke="#F2C14E" fill="none" stroke-linecap="round">
    <circle cx="14" cy="80" r="6" stroke-width="6.75"/>
    <path stroke-width="6.75" d="M17.5 84.3 C22 87 26 88 33 88 H638 C649 88 652.5 97 652 110 C650.5 130 644 146 645.5 168"/>
    <path stroke-width="4.8" d="M645.5 168 C643 184 633 198 621 208"/>
    <path stroke-width="4.8" d="M645.5 168 C646.5 188 645.5 202 641 217"/>
    <path stroke-width="4.8" d="M645.5 168 C650 183 659.5 193.5 669 200"/>
  </g>
  <!-- warp glyphs (drawn over the thread; heddle slots and loom-eyes reveal it) -->
  <g fill="#4A3670">
    <path fill-rule="evenodd" d="M24 40 h18 v78 h46 v18 h-64 Z M24 82 h18 v12 h-18 Z"/>
    <path fill-rule="evenodd" d="M98 40 h64 v96 h-64 Z M110 88 L130 60 L150 88 L130 116 Z"/>
    <path fill-rule="evenodd" d="M176 40 h64 v96 h-64 Z M188 88 L208 60 L228 88 L208 116 Z"/>
    <rect x="254" y="40" width="18" height="96"/>
    <rect x="300" y="40" width="18" height="96"/>
    <rect x="254" y="40" width="64" height="18"/>
    <rect x="280" y="40" width="12" height="60"/>
    <rect x="330" y="40" width="18" height="96"/>
    <rect x="330" y="40" width="64" height="18"/>
    <rect x="330" y="80" width="56" height="18"/>
    <rect x="408" y="40" width="18" height="96"/>
    <rect x="454" y="40" width="18" height="96"/>
    <rect x="408" y="40" width="64" height="18"/>
    <rect x="408" y="102" width="64" height="18"/>
    <path fill-rule="evenodd" d="M486 40 h18 v78 h46 v18 h-64 Z M486 82 h18 v12 h-18 Z"/>
    <path d="M564 40 h18 v78 h46 v18 h-64 Z"/>
  </g>
  <!-- the thread passes OVER the first O -->
  <path d="M98 88 H162" stroke="#14101F" stroke-width="8.75" fill="none" stroke-linecap="butt"/>
  <path d="M98 88 H162" stroke="#F2C14E" stroke-width="6.75" fill="none" stroke-linecap="butt"/>
  <!-- ...and UNDER the second O's eye: the diamond's inner corners lap over it -->
  <path fill="#4A3670" d="M188 88 L195 78.2 L195 97.8 Z M228 88 L221 78.2 L221 97.8 Z"/>
</svg>

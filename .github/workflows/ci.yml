# CI pipeline for MinecraftV2.
#
# Three independent jobs, each of which skips gracefully (job stays green)
# when its target does not exist yet on the branch being built:
#   - content-validation : needs content/       (dependency-free node script)
#   - audio-verification : needs audio/         (installs Playwright + Chromium in $RUNNER_TEMP)
#   - game-tests         : needs package.json   (root package.json is owned elsewhere; never created here)
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Validate game content definitions. scripts/validate-content.mjs is
  # dependency-free, so plain `node` is enough — no npm install, no setup-node.
  # ---------------------------------------------------------------------------
  content-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate content
        run: |
          if [ -d content ]; then
            node scripts/validate-content.mjs
          else
            echo "no content/ directory — skipping"
          fi

  # ---------------------------------------------------------------------------
  # Verify the procedural audio engine by offline-rendering it in headless
  # Chromium. GitHub-hosted runners ship no browsers for Playwright, so we
  # install playwright + Chromium into $RUNNER_TEMP — never into the repo
  # (a root package.json is owned by another branch and must not appear here).
  # ---------------------------------------------------------------------------
  audio-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Detect audio/ and expose the result as an output so the later steps
      # skip cleanly (and the job stays green) when it is absent.
      - name: Check for audio/
        id: audio
        run: |
          if [ ! -d audio ]; then
            echo "no audio/ directory — skipping"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Install Playwright + Chromium (outside the repo)
        if: steps.audio.outputs.present == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y
          npm i playwright
          npx playwright install --with-deps chromium

      - name: Verify audio engine
        if: steps.audio.outputs.present == 'true'
        run: PW_DIR="$RUNNER_TEMP/pw" node scripts/verify-audio.mjs

  # ---------------------------------------------------------------------------
  # Run the game's test suite, if a root package.json with a `test` script
  # exists. Structured so a real `npm test` failure fails the step — the
  # "skipping" fallback only fires when the test script is missing.
  # ---------------------------------------------------------------------------
  game-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: |
          if [ ! -f package.json ]; then
            echo "no package.json — skipping"
            exit 0
          fi
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.test?0:1)"; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm test
          else
            echo "no test script — skipping"
          fi

  # ---------------------------------------------------------------------------
  # Backend load & chaos harness. The multiplayer server does not exist yet, so
  # this job ALWAYS runs a fast SELF-TEST of the harness against the bundled,
  # dependency-free reference mock (scripts/mock-server.mjs, spawned via
  # --spawn) — proving the harness works today and keeping the job green with no
  # real server. When a real server entrypoint lands (root package.json `start`
  # script, a $SERVER_CMD, or a top-level `server` file/dir a.k.a. scripts/../
  # server), it ADDITIONALLY runs the full suite against that real server.
  # Pure Node builtins only — no browser, no Playwright — and this job never
  # creates a root package.json (that file is owned by another branch).
  # ---------------------------------------------------------------------------
  backend-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Always-on: prove the load + chaos harnesses work against the reference
      # mock. Relaxed latency thresholds (P95_MS/P99_MS, env-overridable) keep
      # noisy shared CI runners from flaking a green harness self-test.
      - name: Harness self-test (reference mock)
        run: |
          P95_MS=400 P99_MS=800 node scripts/load-test.mjs --spawn --players 20 --duration-sec 6
          node scripts/chaos-test.mjs --spawn

      # Feature-detect a real server entrypoint and synthesise the command used
      # to launch it. Detected when EITHER $SERVER_CMD is set, OR a root
      # package.json exposes a `start` script, OR a top-level `server` file/dir
      # (scripts/../server) is present. Emits real=<bool> and cmd=<launch cmd>.
      - name: Detect real server entrypoint
        id: server
        run: |
          real=false
          cmd=""
          if [ -n "${SERVER_CMD:-}" ]; then
            echo "detected \$SERVER_CMD"
            cmd="$SERVER_CMD"
            real=true
          elif [ -f package.json ] && node -e "const s=require('./package.json').scripts||{}; process.exit(s.start?0:1)"; then
            echo "detected root package.json start script"
            cmd="npm start"
            real=true
          elif [ -e server ]; then
            echo "detected top-level server entrypoint (scripts/../server)"
            cmd="node server"
            real=true
          else
            echo "no real server entrypoint — reference mock self-test only"
          fi
          echo "real=$real" >> "$GITHUB_OUTPUT"
          echo "cmd=$cmd" >> "$GITHUB_OUTPUT"

      # Only when a real server exists: install its deps (never creating a root
      # package.json), then run the full load + chaos suite against it. The
      # harness's --server-cmd spawns the server, waits for its port, and points
      # GAME_URL at it, so this lights up automatically once the server lands.
      - name: Full load + chaos suite (real server)
        if: steps.server.outputs.real == 'true'
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          fi
          node scripts/load-test.mjs --server-cmd "${{ steps.server.outputs.cmd }}"
          node scripts/chaos-test.mjs --server-cmd "${{ steps.server.outputs.cmd }}"

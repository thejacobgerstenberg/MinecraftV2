<section class="lf-gallery-section" id="gallery-button" aria-labelledby="gallery-button-h">
  <h2 class="lf-h2" id="gallery-button-h">Button</h2>

  <figure>
    <figcaption class="lf-h3">Primary (Everthread CTA) — default / hover / active / disabled / loading</figcaption>
    <div class="lf-row">
      <lf-button variant="primary">Create World</lf-button>
      <lf-button variant="primary" data-demo-hover>Create World</lf-button>
      <lf-button variant="primary" data-demo-active>Create World</lf-button>
      <lf-button variant="primary" disabled>Create World</lf-button>
      <lf-button variant="primary" loading>Creating…</lf-button>
    </div>
  </figure>

  <figure>
    <figcaption class="lf-h3">Secondary — default / hover / active / disabled / loading</figcaption>
    <div class="lf-row">
      <lf-button>Options</lf-button>
      <lf-button data-demo-hover>Options</lf-button>
      <lf-button data-demo-active>Options</lf-button>
      <lf-button disabled>Options</lf-button>
      <lf-button loading>Saving…</lf-button>
    </div>
  </figure>

  <figure>
    <figcaption class="lf-h3">Danger — error label + frayed-X glyph (never hue alone) — default / hover / disabled</figcaption>
    <div class="lf-row">
      <lf-button variant="danger" action="delete">Delete World</lf-button>
      <lf-button variant="danger" data-demo-hover>Delete World</lf-button>
      <lf-button variant="danger" disabled>Delete World</lf-button>
    </div>
  </figure>

  <figure>
    <figcaption class="lf-h3">Sizes — md (default) / sm / icon (aria-label required)</figcaption>
    <div class="lf-row">
      <lf-button variant="primary">Done</lf-button>
      <lf-button size="sm">Back</lf-button>
      <lf-button size="icon" aria-label="Accessibility settings"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false" fill="currentColor"><circle cx="8" cy="3.6" r="2.2"/><path d="M8 6.6 C5 6.6 3.2 7.6 3.2 8.8 L6.4 9.4 L5.6 14.2 A0.9 0.9 0 0 0 7.3 14.7 L8 11.4 L8.7 14.7 A0.9 0.9 0 0 0 10.4 14.2 L9.6 9.4 L12.8 8.8 C12.8 7.6 11 6.6 8 6.6 Z"/></svg></lf-button>
      <lf-button size="icon" aria-label="Close" disabled>×</lf-button>
    </div>
  </figure>

  <figure>
    <figcaption class="lf-h3">Focus — Tab to a button to see the token focus ring (:focus-visible)</figcaption>
    <div class="lf-row">
      <lf-button variant="primary">Tab to me</lf-button>
      <lf-button>Then me</lf-button>
    </div>
  </figure>
</section>

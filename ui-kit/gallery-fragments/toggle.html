<section class="lf-gallery-section" id="gallery-toggle" aria-labelledby="gallery-toggle-h">
  <h2 class="lf-h2" id="gallery-toggle-h">Toggle</h2>

  <figure>
    <figcaption class="lf-h3">Unchecked / checked — "OFF"/"ON" text + knob position + track luminance (three non-hue cues)</figcaption>
    <div class="lf-row">
      <lf-toggle label="Menu Blur"></lf-toggle>
      <lf-toggle label="Menu Blur" checked></lf-toggle>
    </div>
  </figure>

  <figure>
    <figcaption class="lf-h3">Hover / active (demo attributes)</figcaption>
    <div class="lf-row">
      <lf-toggle label="Toggle Sneak" data-demo-hover></lf-toggle>
      <lf-toggle label="Toggle Sprint" checked data-demo-hover></lf-toggle>
      <lf-toggle label="Damage Tilt" checked data-demo-active></lf-toggle>
    </div>
  </figure>

  <figure>
    <figcaption class="lf-h3">Disabled — unchecked / checked (no hover response)</figcaption>
    <div class="lf-row">
      <lf-toggle label="High Contrast" disabled></lf-toggle>
      <lf-toggle label="High Contrast" checked disabled></lf-toggle>
    </div>
  </figure>

  <figure>
    <figcaption class="lf-h3">Focus — Tab to a toggle to see the ring; Space/Enter flips it (role="switch")</figcaption>
    <div class="lf-row">
      <lf-toggle label="Distortion Effects" checked></lf-toggle>
    </div>
  </figure>
</section>

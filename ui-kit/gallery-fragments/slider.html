<section class="lf-gallery-section" id="gallery-slider" aria-labelledby="gallery-slider-h">
  <h2 class="lf-h2" id="gallery-slider-h">Slider</h2>

  <figure>
    <figcaption class="lf-h3">Default — "Name: value" row + gold filled track</figcaption>
    <div class="lf-stack">
      <lf-slider label="Render Distance" min="2" max="12" step="1" value="6"></lf-slider>
      <lf-slider label="FOV" min="60" max="110" step="1" value="75"></lf-slider>
    </div>
  </figure>

  <figure>
    <figcaption class="lf-h3">Hover — value bubble over the knob (also shows on keyboard focus and while dragging)</figcaption>
    <lf-slider label="Sensitivity" min="0.1" max="2" step="0.1" value="1" data-demo-hover></lf-slider>
  </figure>

  <figure>
    <figcaption class="lf-h3">Extents — empty (min) and full (max) fill</figcaption>
    <div class="lf-stack">
      <lf-slider label="Chat Opacity" min="0" max="100" step="5" value="0" unit="%"></lf-slider>
      <lf-slider label="Chat Opacity" min="0" max="100" step="5" value="100" unit="%"></lf-slider>
    </div>
  </figure>

  <figure>
    <figcaption class="lf-h3">Disabled — dim track/knob, no bubble, no interaction</figcaption>
    <lf-slider label="Glint Strength" min="0" max="100" value="40" unit="%" disabled></lf-slider>
  </figure>

  <figure>
    <figcaption class="lf-h3">Focus — Tab to the slider; Arrow keys step, Home/End jump (native range)</figcaption>
    <lf-slider label="Text Background Opacity" min="0" max="100" step="10" value="50" unit="%"></lf-slider>
  </figure>
</section>

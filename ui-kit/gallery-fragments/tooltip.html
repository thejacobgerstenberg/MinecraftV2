<section class="lf-gallery-section" id="gallery-tooltip" aria-labelledby="gallery-tooltip-h">
  <h2 class="lf-h2" id="gallery-tooltip-h">Tooltip</h2>
  <p class="lf-text-sm lf-text-dim">Dark loom-room card in both themes. Shows on hover AND keyboard focus (never hover-only); Escape dismisses. Demos below use the <code>open</code> attribute to pin the bubble for screenshots.</p>

  <figure>
    <figcaption class="lf-h3">Open — placement top (default)</figcaption>
    <div style="padding: 48px 0 0 48px;">
      <lf-tooltip text="Restores 4 hunger" open>
        <button type="button" class="lf-panel-raised">Warp bread</button>
      </lf-tooltip>
    </div>
  </figure>

  <figure>
    <figcaption class="lf-h3">Open — placement bottom</figcaption>
    <div style="padding: 8px 0 56px 96px;">
      <lf-tooltip text="Woven from three hemp fibres" placement="bottom" open>
        <button type="button" class="lf-panel-raised">Loom twine</button>
      </lf-tooltip>
    </div>
  </figure>

  <figure>
    <figcaption class="lf-h3">Open — placement right</figcaption>
    <div style="padding: 8px 0 8px 8px;">
      <lf-tooltip text="Lights 12 blocks" placement="right" open>
        <button type="button" class="lf-panel-raised">Knotlight lantern</button>
      </lf-tooltip>
    </div>
  </figure>

  <figure>
    <figcaption class="lf-h3">Closed (default) — hover or Tab to the trigger to reveal; Escape hides. Focus ring via :focus-visible.</figcaption>
    <div style="padding: 8px 0 8px 8px;">
      <lf-tooltip text="Appears on hover and on keyboard focus">
        <button type="button" class="lf-panel-raised">Hover or focus me</button>
      </lf-tooltip>
    </div>
  </figure>
</section>

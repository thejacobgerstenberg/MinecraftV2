<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>graphics-lab — voxel demo</title>
  <!-- Inline favicon: prevents the /favicon.ico 404 console error. -->
  <link rel="icon" href="data:," />
  <!-- Graphics settings drawer styles (settings/settings.js is imported by
       src/demo.js; the panel is skipped entirely under ?nogui=1). -->
  <link rel="stylesheet" href="./settings/settings.css" />
  <!-- Pack browser (textures/browser/): vendored ui-kit tokens + drawer styles.
       The drawer itself is mounted by src/demo.js (skipped under ?nogui=1). -->
  <link rel="stylesheet" href="./textures/browser/vendored-tokens.css" />
  <link rel="stylesheet" href="./textures/browser/packBrowser.css" />
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #e6edf3;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }

    /* Control-panel mount point (populated by src/gui.js). */
    #gui { position: fixed; top: 12px; right: 12px; z-index: 20; }

    /* Settings gear: bottom-right (the dev GUI owns the top-right corner, so
       the two never overlap; the drawer itself slides over everything at
       z-index 9001). This override is sanctioned by settings/README.md. */
    .mc2gs-gear { top: auto; bottom: 16px; }

    /* Dark loading screen, fades out once the demo signals ready. */
    #loading {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 40%, #131a26 0%, #0b0e14 70%);
      transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .title {
      font-size: 20px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
      color: #cdd9e5;
    }
    #loading .sub { font-size: 13px; color: #6b7684; letter-spacing: 0.04em; }
    #loading .spinner {
      width: 42px; height: 42px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #6ea8fe;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Local ES-module resolution. NO CDN: three is vendored under ./vendor/. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/OrbitControls.js": "./vendor/OrbitControls.js",
      "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="gui"></div>

  <div id="loading">
    <div class="spinner"></div>
    <div class="title">graphics-lab</div>
    <div class="sub">building voxel world…</div>
  </div>

  <script type="module" src="./src/demo.js"></script>

  <script>
    // Hide the loading overlay once the demo reports its first rendered frame.
    (function () {
      var el = document.getElementById('loading');
      var tries = 0;
      var timer = setInterval(function () {
        if (window.__demoReady || tries++ > 200) {
          clearInterval(timer);
          if (el) el.classList.add('hidden');
          setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 700);
        }
      }, 50);
    })();
  </script>
</body>
</html>
